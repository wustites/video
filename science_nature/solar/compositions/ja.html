<!doctype html>
<html lang="ja" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../public/solar-scene.js"></script>
    <script src="../public/voiceover/cues.ja.js"></script>
    <script src="../public/solar-composition.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans JP";
        src: url("https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/Variable/OTF/Subset/NotoSansJP-VF.otf") format("opentype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; }
      body {
        background: #02040b;
        font-family: "Noto Sans JP", sans-serif;
      }
      #root {
        width: 1080px; height: 1920px;
        position: relative; overflow: hidden;
      }
      #solar-canvas {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
      }
      #cueOverlays, .cue-group { position: absolute; inset: 0; }
      .cue-group { opacity: 0; visibility: hidden; z-index: 10; }
      .text-overlay {
        position: absolute; bottom: 200px; left: 50%;
        transform: translateX(-50%);
        width: 900px; text-align: center;
        color: #fff; font-size: 32px; line-height: 1.5;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        z-index: 10;
      }
      .planet-name {
        position: absolute; top: 40px; left: 50%;
        transform: translateX(-50%);
        color: #ffcc00; font-size: 48px; font-weight: bold;
        text-shadow: 0 2px 15px rgba(255,204,0,0.5);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="solar-ja" data-start="0" data-duration="113.636" data-width="1080" data-height="1920">
      <canvas id="solar-canvas"></canvas>
      <div id="cueOverlays"></div>
      <audio id="voiceover" src="../public/voiceover/solar-system-ja.mp3" preload="auto" data-start="0" data-duration="113.136" data-track-index="4" data-volume="1"></audio>
    </div>

    <script>
      SolarComposition.init({ compositionId: "solar-ja" });
    </script>
  </body>
</html>
