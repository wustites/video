<div id="cap-0" class="clip cap" data-start="0.120" data-duration="2.094" data-track-index="1"><span>二零二六年十月三十日晚</span></div>
<div id="cap-1" class="clip cap" data-start="2.214" data-duration="2.619" data-track-index="1"><span>波兰宪法法院被防暴警察包围</span></div>
<div id="cap-2" class="clip cap" data-start="4.833" data-duration="1.655" data-track-index="1"><span>院长被宣布停职</span></div>
<div id="cap-3" class="clip cap" data-start="6.488" data-duration="2.605" data-track-index="1"><span>总统中断出访连夜回国</span></div>
<div id="cap-4" class="clip cap" data-start="9.093" data-duration="2.274" data-track-index="1"><span>反对派说这是一场政变</span></div>
<div id="cap-5" class="clip cap" data-start="11.367" data-duration="2.595" data-track-index="1"><span>政府说这是在恢复法治</span></div>
<div id="cap-6" class="clip cap" data-start="13.962" data-duration="1.804" data-track-index="1"><span>到底发生了什么</span></div>
<div id="cap-7" class="clip cap" data-start="15.864" data-duration="2.214" data-track-index="1"><span>宪法法院有十五名法官</span></div>
<div id="cap-8" class="clip cap" data-start="18.078" data-duration="1.500" data-track-index="1"><span>由议会众议院选出</span></div>
<div id="cap-9" class="clip cap" data-start="19.578" data-duration="1.367" data-track-index="1"><span>任期九年</span></div>
<div id="cap-10" class="clip cap" data-start="20.945" data-duration="1.047" data-track-index="1"><span>二零一五年</span></div>
<div id="cap-11" class="clip cap" data-start="21.992" data-duration="1.869" data-track-index="1"><span>法律与公正党上台</span></div>
<div id="cap-12" class="clip cap" data-start="23.861" data-duration="1.107" data-track-index="1"><span>时任总统</span></div>
<div id="cap-13" class="clip cap" data-start="24.968" data-duration="1.334" data-track-index="1"><span>拒绝为上一届议会</span></div>
<div id="cap-14" class="clip cap" data-start="26.302" data-duration="1.321" data-track-index="1"><span>选出的法官监誓</span></div>
<div id="cap-15" class="clip cap" data-start="27.623" data-duration="2.036" data-track-index="1"><span>新议会另选了一批人</span></div>
<div id="cap-16" class="clip cap" data-start="29.659" data-duration="1.262" data-track-index="1"><span>批评者认为</span></div>
<div id="cap-17" class="clip cap" data-start="30.921" data-duration="2.845" data-track-index="1"><span>法院从此成了执政党的工具</span></div>
<div id="cap-18" class="clip cap" data-start="33.864" data-duration="1.154" data-track-index="1"><span>二零二三年</span></div>
<div id="cap-19" class="clip cap" data-start="35.018" data-duration="0.941" data-track-index="1"><span>图斯克领导的</span></div>
<div id="cap-20" class="clip cap" data-start="35.959" data-duration="1.786" data-track-index="1"><span>亲欧联合政府上台</span></div>
<div id="cap-21" class="clip cap" data-start="37.745" data-duration="1.997" data-track-index="1"><span>不承认这个法院的裁决</span></div>
<div id="cap-22" class="clip cap" data-start="39.742" data-duration="1.238" data-track-index="1"><span>二零二六年</span></div>
<div id="cap-23" class="clip cap" data-start="40.980" data-duration="1.941" data-track-index="1"><span>议会选出八名新法官</span></div>
<div id="cap-24" class="clip cap" data-start="42.921" data-duration="1.416" data-track-index="1"><span>但总统纳夫罗茨基</span></div>
<div id="cap-25" class="clip cap" data-start="44.337" data-duration="1.941" data-track-index="1"><span>站在法律与公正党一边</span></div>
<div id="cap-26" class="clip cap" data-start="46.278" data-duration="1.917" data-track-index="1"><span>只为其中三人监誓</span></div>
<div id="cap-27" class="clip cap" data-start="48.195" data-duration="2.428" data-track-index="1"><span>其余几人在议会自行宣誓</span></div>
<div id="cap-28" class="clip cap" data-start="50.623" data-duration="1.643" data-track-index="1"><span>院长希维昂奇科夫斯基</span></div>
<div id="cap-29" class="clip cap" data-start="52.266" data-duration="2.044" data-track-index="1"><span>不让他们全部上任</span></div>
<div id="cap-30" class="clip cap" data-start="54.408" data-duration="1.369" data-track-index="1"><span>十月三十日晚</span></div>
<div id="cap-31" class="clip cap" data-start="55.777" data-duration="2.295" data-track-index="1"><span>总统正在塞内加尔访问</span></div>
<div id="cap-32" class="clip cap" data-start="58.072" data-duration="1.274" data-track-index="1"><span>七名新法官</span></div>
<div id="cap-33" class="clip cap" data-start="59.346" data-duration="1.928" data-track-index="1"><span>在国家保卫局人员护送下</span></div>
<div id="cap-34" class="clip cap" data-start="61.274" data-duration="1.738" data-track-index="1"><span>进入法院大楼</span></div>
<div id="cap-35" class="clip cap" data-start="63.012" data-duration="1.786" data-track-index="1"><span>其中资历最深的法官</span></div>
<div id="cap-36" class="clip cap" data-start="64.798" data-duration="2.345" data-track-index="1"><span>科尔温-皮奥特罗夫斯卡宣布</span></div>
<div id="cap-37" class="clip cap" data-start="67.143" data-duration="1.988" data-track-index="1"><span>院长和副院长停职一个月</span></div>
<div id="cap-38" class="clip cap" data-start="69.131" data-duration="1.774" data-track-index="1"><span>由她代行院长职务</span></div>
<div id="cap-39" class="clip cap" data-start="70.905" data-duration="0.834" data-track-index="1"><span>随后</span></div>
<div id="cap-40" class="clip cap" data-start="71.739" data-duration="2.299" data-track-index="1"><span>防暴警察包围了法院</span></div>
<div id="cap-41" class="clip cap" data-start="74.136" data-duration="2.357" data-track-index="1"><span>法院原领导层称这是政变</span></div>
<div id="cap-42" class="clip cap" data-start="76.493" data-duration="1.940" data-track-index="1"><span>最高法院第一院长也说</span></div>
<div id="cap-43" class="clip cap" data-start="78.433" data-duration="1.760" data-track-index="1"><span>这毫无疑问是政变</span></div>
<div id="cap-44" class="clip cap" data-start="80.193" data-duration="1.500" data-track-index="1"><span>法律与公正党主席</span></div>
<div id="cap-45" class="clip cap" data-start="81.693" data-duration="2.238" data-track-index="1"><span>卡钦斯基赶到现场抗议</span></div>
<div id="cap-46" class="clip cap" data-start="83.931" data-duration="2.964" data-track-index="1"><span>说波兰正在变成警察国家</span></div>
<div id="cap-47" class="clip cap" data-start="86.895" data-duration="2.012" data-track-index="1"><span>连批评该党多年的法学家</span></div>
<div id="cap-48" class="clip cap" data-start="88.907" data-duration="0.964" data-track-index="1"><span>也指出</span></div>
<div id="cap-49" class="clip cap" data-start="89.871" data-duration="1.381" data-track-index="1"><span>这次停职引用的</span></div>
<div id="cap-50" class="clip cap" data-start="91.252" data-duration="1.512" data-track-index="1"><span>是普通法院的法律</span></div>
<div id="cap-51" class="clip cap" data-start="92.764" data-duration="1.441" data-track-index="1"><span>用在宪法法院上</span></div>
<div id="cap-52" class="clip cap" data-start="94.205" data-duration="1.649" data-track-index="1"><span>缺乏依据</span></div>
<div id="cap-53" class="clip cap" data-start="95.952" data-duration="2.271" data-track-index="1"><span>总统的专机中途折返</span></div>
<div id="cap-54" class="clip cap" data-start="98.223" data-duration="1.393" data-track-index="1"><span>三十一日凌晨</span></div>
<div id="cap-55" class="clip cap" data-start="99.616" data-duration="1.095" data-track-index="1"><span>纳夫罗茨基</span></div>
<div id="cap-56" class="clip cap" data-start="100.711" data-duration="1.941" data-track-index="1"><span>和最高法院第一院长一起</span></div>
<div id="cap-57" class="clip cap" data-start="102.652" data-duration="1.333" data-track-index="1"><span>进入宪法法院</span></div>
<div id="cap-58" class="clip cap" data-start="103.985" data-duration="1.952" data-track-index="1"><span>与新法官发生推挤</span></div>
<div id="cap-59" class="clip cap" data-start="105.937" data-duration="1.084" data-track-index="1"><span>总统府宣布</span></div>
<div id="cap-60" class="clip cap" data-start="107.021" data-duration="1.833" data-track-index="1"><span>宪法秩序遭到破坏</span></div>
<div id="cap-61" class="clip cap" data-start="108.854" data-duration="2.321" data-track-index="1"><span>并召集各党紧急磋商</span></div>
<div id="cap-62" class="clip cap" data-start="111.175" data-duration="3.000" data-track-index="1"><span>司法部长则指责总统强行闯入</span></div>
<div id="cap-63" class="clip cap" data-start="114.175" data-duration="1.719" data-track-index="1"><span>攻击法官</span></div>
<div id="cap-64" class="clip cap" data-start="115.992" data-duration="1.392" data-track-index="1"><span>总理图斯克说</span></div>
<div id="cap-65" class="clip cap" data-start="117.384" data-duration="1.596" data-track-index="1"><span>恢复法治很痛苦</span></div>
<div id="cap-66" class="clip cap" data-start="118.980" data-duration="1.390" data-track-index="1"><span>但别无他法</span></div>
<div id="cap-67" class="clip cap" data-start="120.370" data-duration="0.881" data-track-index="1"><span>现在</span></div>
<div id="cap-68" class="clip cap" data-start="121.251" data-duration="2.714" data-track-index="1"><span>同一座法院出现了两套领导层</span></div>
<div id="cap-69" class="clip cap" data-start="123.965" data-duration="2.405" data-track-index="1"><span>双方都说自己才合法</span></div>
<div id="cap-70" class="clip cap" data-start="126.370" data-duration="1.572" data-track-index="1"><span>谁有权解释宪法</span></div>
<div id="cap-71" class="clip cap" data-start="127.942" data-duration="2.472" data-track-index="1"><span>这场争夺还没有结束</span></div>
