name: Render project release

on:
  push:
    tags:
      - '*-*.*.*'

permissions:
  contents: write

concurrency:
  group: render-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  render-release:
    name: Render ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Parse and validate tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TAG" =~ ^([A-Za-z0-9_]+)-([0-9]+\.[0-9]+\.[0-9]+)(-([A-Za-z0-9_]+))?$ ]]; then
            project_key="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            variant="${BASH_REMATCH[4]}"
          else
            echo "Invalid tag: $TAG" >&2
            echo "Expected: <project_key>-<semver>[-<variant>], for example solar-1.0.0-zh" >&2
            exit 1
          fi

          project_dir="$(node -e 'const manifest=require("./projects.json"); const project=manifest.projects?.[process.argv[1]]; if (!project) process.exit(1); process.stdout.write(project.path)' "$project_key" 2>/dev/null || true)"
          if [[ -z "$project_dir" ]]; then
            echo "Project '$project_key' is not registered in projects.json" >&2
            exit 1
          fi

          if [[ ! -f "$project_dir/package.json" ]]; then
            echo "Project directory '$project_dir' must contain package.json" >&2
            exit 1
          fi

          if ! PROJECT_VARIANT="$variant" node -e 'const p=require("./" + process.argv[1] + "/package.json"); const variant=process.env.PROJECT_VARIANT; const script=variant ? `render:${variant}` : "render"; process.exit(p.scripts?.[script] ? 0 : 1)' "$project_dir"; then
            if [[ -n "$variant" ]]; then
              echo "Project '$project_key' must define npm run render:$variant" >&2
            else
              echo "Project '$project_key' must define an npm run render script" >&2
            fi
            exit 1
          fi

          echo "project_key=$project_key" >> "$GITHUB_OUTPUT"
          echo "project=$project_dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          asset_prefix="${project_key}-${version}"
          if [[ -n "$variant" ]]; then
            asset_prefix="${asset_prefix}-${variant}"
          fi
          echo "asset_prefix=$asset_prefix" >> "$GITHUB_OUTPUT"
          release_name="${project_key} ${version}"
          if [[ -n "$variant" ]]; then
            release_name="${release_name} ${variant}"
          fi
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "project_dir=$GITHUB_WORKSPACE/${project_dir#./}" >> "$GITHUB_OUTPUT"
          echo "release_dir=$RUNNER_TEMP/release" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate project manifest
        run: npm run validate:projects

      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Set up Python for voiceover
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate voiceover when the project defines it
        working-directory: ${{ steps.release.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.voiceover ? 0 : 1)"; then
            python -m pip install --requirement "$GITHUB_WORKSPACE/requirements-voiceover.txt"
            npm run voiceover
          else
            echo "No voiceover script defined — skipping"
          fi

      - name: Type-check project
        working-directory: ${{ steps.release.outputs.project_dir }}
        run: npm run check --if-present

      - name: Render video
        working-directory: ${{ steps.release.outputs.project_dir }}
        env:
          CI: 'true'
          PROJECT_VARIANT: ${{ steps.release.outputs.variant }}
        run: |
          rm -rf out
          mkdir -p out
          if [[ -n "$PROJECT_VARIANT" ]]; then
            npm run "render:$PROJECT_VARIANT"
          else
            npm run render
          fi

      - name: Validate rendered MP4 files
        env:
          PROJECT_DIR: ${{ steps.release.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' videos < <(find "$PROJECT_DIR/out" -maxdepth 1 -type f -name '*.mp4' -print0)

          if [[ "${#videos[@]}" -eq 0 ]]; then
            echo "No MP4 files were rendered in $PROJECT_DIR/out" >&2
            exit 1
          fi

          expects_audio="$(PROJECT_DIR="$PROJECT_DIR" node -e 'const p=require(process.env.PROJECT_DIR + "/package.json"); process.stdout.write(p.scripts?.voiceover ? "true" : "false")')"

          for video in "${videos[@]}"; do
            video_streams="$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$video")"
            if [[ -z "$video_streams" ]]; then
              echo "No video stream found in $video" >&2
              exit 1
            fi
            if [[ "$expects_audio" == "true" ]]; then
              audio_streams="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
              if [[ -z "$audio_streams" ]]; then
                echo "Project defines voiceover but no audio stream was found in $video" >&2
                exit 1
              fi
            fi
            duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")"
            if ! VIDEO_DURATION="$duration" node -e 'const value=Number(process.env.VIDEO_DURATION); process.exit(Number.isFinite(value) && value > 0 ? 0 : 1)'; then
              echo "Invalid duration '$duration' in $video" >&2
              exit 1
            fi
          done

      - name: Prepare release assets
        id: assets
        env:
          ASSET_PREFIX: ${{ steps.release.outputs.asset_prefix }}
          PROJECT_DIR: ${{ steps.release.outputs.project_dir }}
          RELEASE_DIR: ${{ steps.release.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' videos < <(find "$PROJECT_DIR/out" -maxdepth 1 -type f -name '*.mp4' -print0)
          mkdir -p "$RELEASE_DIR"

          if [[ "${#videos[@]}" -eq 1 ]]; then
            cp "${videos[0]}" "$RELEASE_DIR/$ASSET_PREFIX.mp4"
          else
            for video in "${videos[@]}"; do
              base="$(basename "$video")"
              cp "$video" "$RELEASE_DIR/${ASSET_PREFIX}-${base}"
            done
          fi

          echo "path=$RELEASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.asset_prefix }}
          path: ${{ steps.assets.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.release_name }}
          generate_release_notes: true
          files: ${{ steps.assets.outputs.path }}/*.mp4
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
