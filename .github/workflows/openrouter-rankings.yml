name: openrouter-rankings - Build and release video

on:
  push:
    tags:
      - "v*-openrouter-rankings"

permissions:
  contents: write

concurrency:
  group: openrouter-rankings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render openrouter-rankings video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run setup (fetch data) if defined
        run: |
          if [ -f package.json ] && grep -q '"setup"' package.json; then
            npm run setup
          else
            echo "No setup script defined — skipping"
          fi
        working-directory: openrouter-rankings

      - name: Validate compositions
        run: npm run check
        working-directory: openrouter-rankings

      - name: Render videos
        run: npm run render
        working-directory: openrouter-rankings

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-rankings-${{ github.ref_name }}
          path: openrouter-rankings/out/*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: openrouter-rankings/out/*.mp4
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
