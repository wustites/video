name: solar - Build and release video

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-solar"

permissions:
  contents: write

concurrency:
  group: solar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build solar video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate voiceover
        run: |
          python -m pip install edge-tts==7.2.7
          npm run voiceover
        working-directory: solar

      - name: Validate audio sync and compositions
        run: npm run check
        working-directory: solar

      - name: Render videos
        run: |
          npx --yes hyperframes@0.6.112 render -c compositions/en.html -o out/solar-system-en-vertical.mp4
          npx --yes hyperframes@0.6.112 render -c compositions/zh.html -o out/solar-system-zh-vertical.mp4
          npx --yes hyperframes@0.6.112 render -c compositions/ja.html -o out/solar-system-ja-vertical.mp4
          npx --yes hyperframes@0.6.112 render -c compositions/ko.html -o out/solar-system-ko-vertical.mp4
        working-directory: solar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-system-${{ github.ref_name }}
          path: solar/out/*.mp4
          if-no-files-found: error

      - name: Upload sync diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: solar-sync-${{ github.ref_name }}
          path: |
            solar/public/voiceover/*.mp3
            solar/public/voiceover/cues.*.json
          if-no-files-found: error
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: solar/out/*.mp4
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
