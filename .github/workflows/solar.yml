name: solar - Build and release video

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language to build
        required: true
        default: all
        type: choice
        options:
          - all
          - en
          - zh
          - ja
          - ko
  push:
    tags:
      - "v*-solar"
      - "v*-solar-en"
      - "v*-solar-zh"
      - "v*-solar-ja"
      - "v*-solar-ko"

permissions:
  contents: write

concurrency:
  group: solar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build solar video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Resolve target language
        id: target
        shell: bash
        env:
          DISPATCH_LANGUAGE: ${{ inputs.language }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          language="${DISPATCH_LANGUAGE:-all}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "$REF_NAME" =~ -solar-(en|zh|ja|ko)$ ]]; then
              language="${BASH_REMATCH[1]}"
            else
              language="all"
            fi
          fi

          case "$language" in
            en|zh|ja|ko)
              echo "language=$language" >> "$GITHUB_OUTPUT"
              echo "video_path=solar/out/solar-system-$language-vertical.mp4" >> "$GITHUB_OUTPUT"
              echo "audio_path=solar/public/voiceover/solar-system-$language.mp3" >> "$GITHUB_OUTPUT"
              echo "cue_path=solar/public/voiceover/cues.$language.json" >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo "language=all" >> "$GITHUB_OUTPUT"
              echo "video_path=solar/out/*.mp4" >> "$GITHUB_OUTPUT"
              echo "audio_path=solar/public/voiceover/*.mp3" >> "$GITHUB_OUTPUT"
              echo "cue_path=solar/public/voiceover/cues.*.json" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported language: $language" >&2
              exit 1
              ;;
          esac
          echo "Selected language: $language"

      - name: Generate voiceover
        env:
          LANGUAGE: ${{ steps.target.outputs.language }}
        run: |
          python -m pip install edge-tts==7.2.7
          if [ "$LANGUAGE" = "all" ]; then
            npm run voiceover
          else
            npm run voiceover -- --language "$LANGUAGE"
          fi
        working-directory: solar

      - name: Validate audio sync and compositions
        env:
          LANGUAGE: ${{ steps.target.outputs.language }}
        run: |
          if [ "$LANGUAGE" = "all" ]; then
            npm run sync:validate
            npm run lint
            npm run validate
            npm run inspect
          else
            npm run sync:validate -- --language "$LANGUAGE"
            lint_dir="$RUNNER_TEMP/solar-lint-$LANGUAGE"
            rm -rf "$lint_dir"
            mkdir -p "$lint_dir/compositions"
            cp "compositions/$LANGUAGE.html" "$lint_dir/compositions/$LANGUAGE.html"
            sed "s#compositions/en.html#compositions/$LANGUAGE.html#" index.html > "$lint_dir/index.html"
            ln -s "$GITHUB_WORKSPACE/solar/public" "$lint_dir/public"
            npx --yes hyperframes@0.6.112 lint "$lint_dir"
            npx --yes hyperframes@0.6.112 validate "$lint_dir"
            npx --yes hyperframes@0.6.112 inspect "$lint_dir" --samples 10
          fi
        working-directory: solar

      - name: Render videos
        env:
          LANGUAGE: ${{ steps.target.outputs.language }}
        run: |
          if [ "$LANGUAGE" = "all" ]; then
            npm run render
          else
            npm run "render:$LANGUAGE"
          fi
        working-directory: solar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-system-${{ steps.target.outputs.language }}-${{ github.ref_name }}
          path: ${{ steps.target.outputs.video_path }}
          if-no-files-found: error

      - name: Upload sync diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: solar-sync-${{ steps.target.outputs.language }}-${{ github.ref_name }}
          path: |
            ${{ steps.target.outputs.audio_path }}
            ${{ steps.target.outputs.cue_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.target.outputs.video_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
