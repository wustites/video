name: sapporo-subway - Build and release video

on:
  push:
    tags:
      - "v*-sapporo-subway"

permissions:
  contents: write

concurrency:
  group: sapporo-subway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sapporo-subway video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sapporo-subway/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sapporo-subway

      - name: Setup Python for voiceover
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Japanese voiceover
        run: |
          python -m pip install --upgrade pip edge-tts
          npm run voiceover
        working-directory: sapporo-subway

      - name: Run setup (fetch data) if defined
        run: |
          if [ -f package.json ] && grep -q '"setup"' package.json; then
            npm run setup
          else
            echo "No setup script defined — skipping"
          fi
        working-directory: sapporo-subway

      - name: Type check
        run: npm run check
        working-directory: sapporo-subway

      - name: Render video
        run: npm run render
        working-directory: sapporo-subway

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapporo-subway-video
          path: sapporo-subway/out/video.mp4
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: sapporo-subway/out/video.mp4
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
