name: cloudflare-history - Build and release video

on:
  push:
    tags:
      - "v*-cloudflare-history"

permissions:
  contents: write

concurrency:
  group: cloudflare-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build cloudflare-history video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-history/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare-history

      - name: Type check
        run: npm run check
        working-directory: cloudflare-history

      - name: Render video
        run: npm run render
        working-directory: cloudflare-history

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-history-video
          path: cloudflare-history/out/video.mp4
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: cloudflare-history/out/video.mp4
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}