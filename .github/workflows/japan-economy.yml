name: japan-economy - Build and release video

on:
  push:
    tags:
      - "v*-japan-economy"

permissions:
  contents: write

concurrency:
  group: japan-economy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build japan-economy video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: japan-economy/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: japan-economy

      - name: Type check
        run: npm run check
        working-directory: japan-economy

      - name: Render video
        run: npm run render
        working-directory: japan-economy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: japan-economy-video
          path: japan-economy/out/video.mp4
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: japan-economy/out/video.mp4
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
