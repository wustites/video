name: metro-lima - Build and release video

on:
  push:
    tags:
      - "v*-metro-lima"

permissions:
  contents: write

concurrency:
  group: metro-lima-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build metro-lima video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: metro-lima/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: metro-lima

      - name: Run setup (fetch data) if defined
        run: |
          if [ -f package.json ] && grep -q '"setup"' package.json; then
            npm run setup
          else
            echo "No setup script defined — skipping"
          fi
        working-directory: metro-lima

      - name: Type check
        run: npm run check
        working-directory: metro-lima

      - name: Render video
        run: npm run render
        working-directory: metro-lima

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metro-lima-video
          path: metro-lima/out/video.mp4
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: metro-lima/out/video.mp4
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
